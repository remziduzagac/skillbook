name: Release

# A pushed tag vX.Y.Z publishes a release. The install tests run on Linux and macOS first; then
# scripts/pack-release.sh packs every set named in skills/released, the files are attested, and a draft release with
# the CHANGELOG.md section as notes is published once every file is uploaded. Last, it runs pages.yml by hand on main,
# so the site's stable channel names the new release. scripts/release.sh makes the tag.
#
# Running it by hand rehearses a version instead: a private draft release, without attestation. Delete the draft
# afterwards.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: version to rehearse, such as 0.2.0; builds a private draft release
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            draft=false
          else
            version="$INPUT_VERSION"
            draft=true
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 0.2.0, not $version"
            exit 1
          fi
          if [ "$draft" = false ] && ! grep -q "^## \[$version\] - [0-9]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  test-install:
    name: install tests (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/install-test.sh

  publish:
    name: publish
    needs: [version, test-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestation
      attestations: write # store the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      DRAFT: ${{ needs.version.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack the release
        run: scripts/pack-release.sh "$VERSION" dist
      - name: Attest the files
        if: needs.version.outputs.draft == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write the notes
        run: |
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ "$DRAFT" = true ] && ! grep -q '[^[:space:]]' notes.md; then
            echo "Rehearsal of skillbook $VERSION." > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md's section for $VERSION is empty"
            exit 1
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          site="https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo
            echo "### Installing"
            echo
            for script in dist/install-*.sh; do
              name=$(basename "$script")
              set=${name#install-}
              echo "- ${set%.sh}: \`curl -fsSL $site/$name | sh\`, or this release exactly: \`curl -fsSL $download/$name | sh\`"
            done
            echo
            printf '%s %s %s\n' "Then ask your agent to set up skillbook." \
              "To check the files, run \`sha256sum -c SHA256SUMS\`, or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`." \
              "[Installing]($site/docs/install/) covers updating, previews and removing."
          } >> notes.md
      - name: Publish the release
        run: |
          if [ "$DRAFT" = true ]; then
            gh release create "v$VERSION-rehearsal.$GITHUB_RUN_NUMBER" dist/* --draft --target "$GITHUB_SHA" \
              --title "skillbook $VERSION (rehearsal $GITHUB_RUN_NUMBER)" --notes-file notes.md
          else
            gh release create "v$VERSION" dist/* --draft --verify-tag --title "skillbook $VERSION" --notes-file notes.md
            gh release edit "v$VERSION" --draft=false
          fi

  pages:
    name: deploy the site
    needs: [version, publish]
    if: needs.version.outputs.draft == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # run pages.yml by hand on main
    steps:
      - name: Run pages.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
