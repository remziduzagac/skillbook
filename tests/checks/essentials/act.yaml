        "line": 16,
        "text": "4. **Get evidence before making a claim.** Nobody can trust a claim they cannot check. Use the kind it needs: file and line, or \"not found\", for project contents; command and output for behaviour. If you did not run it, say the claim comes from reading and why it was not run. For outside facts, use a current, authoritative source. Every source must meet that test. An old note does not.\n   - **Read `act-verify` before claiming work is done, fixed, passing, correct or meets requirements.** Read it before answering whether it does too. Such claims need more, such as who checks them. \"Is the export in the format the spec sets?\" needs it. \"Which file defines the export?\" does not.\n   - Treat reporting a change as made as such a claim when, as far as you know, its result reaches other people before anyone checks it again, or a mistake in it cannot be undone. Examples: work sent, published or used by them. A catalogue price going to print tomorrow needs `act-verify`. A test renamed on a branch going to review does not."
