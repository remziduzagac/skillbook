      "source": {
        "file": "skills/essentials/references/act/verify.md",
        "line": 23,
        "text": "1. **Choose evidence that would fail if the claim were false.** An unchecked claim reads as true:\n\n   | Claim | Evidence | Not enough |\n   | --- | --- | --- |\n   | tests pass | the test run: 0 failures | an earlier run, \"should pass\" |\n   | bug fixed | the original symptom, now gone | the code changed |\n   | requirements met | a line-by-line checklist | tests passing |\n   | another agent's work done | its changes, seen | its own report of success |\n   | nothing lost in a merge or split | the inventory of what was there | \"looks complete\" |\n   | something made is correct | each part against its source, or each figure worked out again | \"reads right\" |"
      },
      "applicability": "claim",
      "required_skill": "act-verify",
      "deadline": "answer",
      "expected": "Choose evidence that would fail if the claim were false.",
      "rejected": "Treating a changed file or a helper success claim as verification.",
      "evidence": "Code first: ordered file/action evidence. Otherwise yes/no with a verbatim answer quote or recorded action id. Missing evidence is unknown.",
      "user_choices": "Open intent, audience, result kind and any changed approval scope remain the user's.",
      "no_skill_eligible": true
    },
