source = "blueprint/design/testing.md: project skill scenarios, test 3"
about = "Fix a spelling error in a built skill while preserving its design and fallback. Rejects rewriting the design or dropping required behaviour."
fixture = "skill-lab"
project_skills = ["skillbook-tree", "skillbook-write"]
skills = ["skillbook-write"]
covers = ["skillbook-write:rule:1", "skillbook-write:step:5", "skillbook-write:last"]
category = "normal"
rejects = "Leaves the typo, rewrites the design or removes the unavailable-capability fallback."
review = ["Only the misspelled word is corrected; no new rule, route or policy is introduced.", "Unavailable repository checks are reported honestly rather than claimed as passing."]

[[turns]]
prompt = "Correct only the misspelling of explanation in skills/essentials/references/respond/explain.md. Keep every instruction and the design unchanged."

[checks]
reads = ["skillbook-write"]
changed = ["skills/essentials/references/respond/explain.md"]
unchanged = ["blueprint/design/essentials/respond.md", "blueprint/design/essentials/organize.md"]

[checks.file_contains]
"skills/essentials/references/respond/explain.md" = [
  'Explains a point the agent said that did not land\.',
  'Put the point in plain words\. This explanation stays focused on what the user did not understand\.',
  'If a capability is unavailable, say so and continue with a response-only explanation\.',
]
