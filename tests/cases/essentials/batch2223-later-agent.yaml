source: 'Issues #22 and #23; D271 and D272'
fixture: continuation-lab
agents:
- codex
category: normal
version_control: true
about: Later agent takeover gets a saved carryover
skills:
- coordinate-carryover
covers:
- coordinate:route:coordinate-carryover
- coordinate:not-for:coordinate-brief
rejects: Returns a worker brief or asks whether to write instead of saving the carryover.
review:
- Returns a worker brief or asks whether to write instead of saving the carryover. Require the useful requested
  result, not a refusal or a bare filename.
- A saved carryover must preserve the goal, current files, uncertainty, remaining work and bounded approvals. Keep
  independent review pending when unavailable.
turns:
- prompt: Another agent will take over the unfinished exhibit work in project.md next week.
checks:
  names_no_skill: false
  answer_not_contains:
  - (?i:where (?:should|would|do).*?(?:save|write)|what (?:file|path|location).*?(?:use|prefer)|may I write|shall
    I write)
  written_under: {"": 1}
  unchanged:
  - project.md
  - AGENTS.md
  answer_contains:
  - '[0-9]{4}[-_]?[0-9]{2}[-_]?[0-9]{2}'
  - '[-_][0-9]{2}[-:]?[0-9]{2}[-_.]'
  - '[A-Za-z][A-Za-z0-9_-]*\.md'
