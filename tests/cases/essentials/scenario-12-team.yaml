      - id: behavior
        tag: skill:understand-brainstorm
        criterion: "Offer materially different approaches and suitable differentiated names, not near-identical variants; leave the choice open."
      - id: extra-1
        tag: skill:understand-naming
        criterion: "Give name options that differ in meaning or associations and explain their fit. For requested reasons, accept grounded reasons or a plain explanation of why the available facts give no basis for one."
