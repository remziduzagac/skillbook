  facts:
    scope: Delegation is explicitly requested for forty notes and independent views; three-note lookup must stay local.
  mode: fixed
skills:
  - coordinate-delegate
  - coordinate-delegate-council
  - coordinate-delegate-fanout
category: normal
rejects: "Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity."
