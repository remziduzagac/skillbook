about: Plan a shop move within landlord constraints.
design: "blueprint/design/testing.md#scenario-layer"
goal: Plan a shop move within landlord constraints.
fixture: scenarios/shop
agents:
  - codex
user:
  description: "You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access."
  facts:
    choices: "Ground floor shop, upper storage; no drilling, delivery window 08–10 weekdays, signs need written approval. Budget $3000, move next month, two staff. User wants a questionnaire first, then ground level before upper level."
  mode: fixed
skills:
  - understand-clarify-deep
  - understand-clarify-questionnaire
category: normal
rejects: "Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity."
turns:
  - prompt: Read lease.md. Send a questionnaire I can forward to the landlord about the shop fit-out. It must make sense without our conversation.
    purpose: "Produce a self-contained answerable questionnaire that includes relevant known constraints and asks only unresolved landlord facts. A recommended answer beside a question is allowed while the choice stays with the user; do not treat it as the user's answer or invent user facts."
    rubric:
      - id: point
        tag: habit:point-first
        criterion: "Judge only the final answer. It uses plain English and leads with the user's main point or required question, without unnecessary preamble or internal process detail. Progress lines are not preamble and are not scored."
      - id: glance
        tag: habit:clear-at-a-glance
        criterion: "Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created."
      - id: scope
        tag: habit:requested-scope
        criterion: "Judge only this turn: do the approved requested work. If the kind or subject of the result is open and plausible interpretations require different results, ask what it should cover before choosing. Respect settled choices and approval boundaries. A review question after completed approved work is allowed, not renewed permission. Do not charge an earlier turn's failure to this turn."
      - id: behavior
        tag: skill:understand-clarify-questionnaire
        criterion: "Produce a self-contained answerable questionnaire that includes relevant known constraints and asks only unresolved landlord facts. A recommended answer beside a question is allowed while the choice stays with the user; do not treat it as the user's answer or invent user facts."
