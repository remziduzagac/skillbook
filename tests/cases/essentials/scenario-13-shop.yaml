- prompt: 'Ground floor: keep the counter by the door, no new fixtures or signs, use freestanding shelves. That settles it. Move to upper-floor storage now.'
  purpose: Treat ground floor as settled, move one level to storage, ask relevant storage choices without inventing user answers. A recommended answer beside a question is allowed while the choice stays with the user; do not treat it as the user's answer or invent user facts.
