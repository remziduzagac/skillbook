source = "blueprint/design/essentials/act.md: rightsize, lean"
about = "Trimming what already exists: turn 1 lists the changes and changes nothing; after the user approves, turn 2 applies them. A refusal, or applying at once, fails."
fixture = "tiny-weather"

[[turns]]
prompt = "Make NOTES.md shorter."

[turns.checks]
no_changes = true
answer_contains = ['NOTES', '(?m)^\s*([-*]|\d+\.)\s']

[[turns]]
prompt = "Yes, apply those changes."

[turns.checks]
changed = ["NOTES.md"]

[checks]
reads = ["essentials", "understand", "act", "respond"]
