source = "blueprint/design/essentials/act.md: rightsize, lean"
about = "Trimming what already exists, through the lean skill: turn 1 lists the changes and changes nothing; after the user approves, turn 2 makes NOTES.md shorter and keeps its facts. Rejects applying at once, a refusal, or a change that drops facts or does not shorten it."
fixture = "tiny-weather"

[[turns]]
prompt = "Make NOTES.md shorter."

[turns.checks]
no_changes = true
answer_contains = ['NOTES', '(?m)^\s*([-*]|\d+\.)\s']

[[turns]]
prompt = "Yes, apply those changes."

[turns.checks]
changed = ["NOTES.md"]

[checks]
reads = ["essentials", "understand", "act", "respond", "act-rightsize-lean"]
shorter = ["NOTES.md"]

[checks.file_contains]
"NOTES.md" = ['cache', 'cit(y|ies)', 'service']
