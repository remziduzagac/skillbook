source = "blueprint/design/essentials/act.md: cleanup, tests 1, 17 and 24"
about = "A server started to check something is stopped once the check is done, by its own process ID or with the command that needed it, and checked as gone. Its own temporary files from the check go too. Rejects leaving it running, stopping it by a name pattern, or leaving a fetched copy or a log in the temporary folder."
fixture = "recipe-box"
skills = ["act", "act-cleanup"]
covers = ["act-cleanup:rule:2", "act-cleanup:rule:3", "act-cleanup:rule:4", "act-cleanup:rule:6", "act-cleanup:advice:4", "act-cleanup:step:2", "act-cleanup:step:6"]
category = "normal"
rejects = "Leaves serve.py running after answering, relies on its two-minute limit, stops it with pkill or killall by name, or leaves its fetched copy or log in the temporary folder."
review = ["The answer shows that pancakes.md was fetched from the server, or says plainly why it could not be.", "The action records show the server stopped by its recorded process ID or background-task handle, or started so that it ended with the command that needed it; never by a name pattern such as pkill python.", "The answer says the server was stopped and that this was checked, such as the process being gone; the runner's record of what was still running when the turn ended agrees.", "Its own temporary files from the check, such as a fetched copy or the server's log, are removed by their exact paths before the answer; the temporary-folder listing agrees."]

[[turns]]
prompt = "Check that serve.py really serves the pancake recipe: start it and fetch pancakes.md from it."

[checks]
no_changes = true
nothing_left_running = true
answer_contains = ['pancake']
# its own files from the check, such as a fetched copy or the server's log, are gone once it answers; a file kept
# without a reason the task gives is a leftover, so naming it is not enough
tmp_lacks = ['\.(md|log|txt|html?|out)$', 'pancake']
