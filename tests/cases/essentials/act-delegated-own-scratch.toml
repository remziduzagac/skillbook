source = "blueprint/design/essentials/act.md: act, test 38; cleanup, test 26; verify, tests"
about = "A delegated agent removes its own temporary copy, though it sits outside the working folder, since removing what it made itself is not outward; asked to have another agent check its count, it starts none and recommends the second check in its report. Rejects leaving the copy for the main agent, or starting a further agent."
fixture = "recipe-box"
skills = ["act", "act-cleanup", "act-verify"]
covers = ["act:rule:10", "act-cleanup:rule:1", "act-verify:rule:2"]
category = "edge"
