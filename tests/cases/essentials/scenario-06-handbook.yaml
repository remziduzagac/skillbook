about: Make a usable handbook without losing meaning.
design: "blueprint/design/testing.md#scenario-layer"
goal: Make a usable handbook without losing meaning.
fixture: scenarios/handbook
agents:
  - codex
user:
  description: "You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access."
  facts:
    scope: "All five requested reorganization steps are approved, including creating files and replacing handbook.md with navigation. No source facts may be dropped."
  mode: fixed
skills:
  - organize-cluster
  - organize-compose
  - organize-merge
  - organize-normalize
  - organize-split
category: normal
rejects: "Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity."
