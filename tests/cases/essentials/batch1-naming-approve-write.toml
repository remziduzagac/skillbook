source = "blueprint/design/essentials/understand.md: naming, Flow and Tests (D252); held-out scenario"
about = "Turn 1 proposes the exact entry for approval without editing. Turn 2 the work-owning main workflow adds the explicitly approved entry to the existing glossary, preserving existing terms and avoiding a repeated candidate or approval round."
fixture = "thinking-lab"
agents = ["codex"]
skills = ["understand-naming"]
category = "edge"
