[[turns]]
prompt = "Create a practical handover pack for the museum reminder process so a substitute volunteer can run it. The approved operational facts are: Mei updates the paper rota, a reminder goes on the staff noticeboard weekly, and volunteers check that board. Work out how to package this in the project."

[turns.checks]
no_changes = true

[[turns]]
prompt = "Go ahead with the proposed approach. Put the pack in HANDOVER.md and CHECKLIST.md only, using those approved facts. No other changes."

