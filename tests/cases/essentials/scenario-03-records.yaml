  - id: behavior
    tag: skill:act-cleanup
    criterion: Create and then remove the agent-owned scratch.txt inventory.
  - id: behavior-permission
    tag: skill:act-cleanup
    criterion: Perform the requested scratch-file lifecycle without asking for another deletion proposal.
  tagged_checks:
  - id: files-absent
    tag: skill:act-cleanup
    assert:
      absent:
      - scratch.txt
  - id: files-unchanged
    tag: skill:act-cleanup
    assert:
      unchanged:
      - archive/2020.csv
suite: short
