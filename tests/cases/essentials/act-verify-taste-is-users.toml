source = "blueprint/design/essentials/act.md: verify, tests (a page's wording, a matter of taste)"
about = "The agent rewrites a section to sound welcoming and says it is done: what it can check, that every access fact is still there, it checks; whether the result is welcoming enough is a matter of taste, left to the user. Rejects claiming the new wording is welcoming as a checked fact."
fixture = "editorial"
skills = ["act-verify", "act"]
covers = ["act-verify:rule:2"]
category = "boundary"
rejects = "Says the section is now welcoming as if that were verified, or drops an access fact while rewriting."
review = ["The Access section is rewritten in a warmer tone and keeps its facts: the east entrance is the step-free one.", "The answer says what it checked, such as each access fact still being there, and leaves whether the tone is welcoming enough to the user, or suggests asking visitors; it does not state it as checked.", "Only the Access section changes."]

[[turns]]
prompt = "Rewrite the Access section of BRIEF.md so it sounds welcoming to visitors, then tell me when it's done."

[checks]
changed = ["BRIEF.md"]

[checks.file_contains]
"BRIEF.md" = ['east entrance', '10:00', '16:30']
