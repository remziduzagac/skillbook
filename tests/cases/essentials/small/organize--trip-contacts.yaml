about: >-
  The organize guide on giving a repeated section one home, with the exact arrangement given, in one turn: the request approves it, so the move is made,
  each page links to the new file, and the answer reports how the result was checked and what the check found. Rejects: a stop for leave, or a report with no check.
goal: Move the emergency contacts repeated on three trip pages into one contacts file, each page linking to it, losing nothing.
fixture: small/trip-pages
turns:
  - prompt: Our three trip pages all repeat the same emergency contacts. Put that section in a new contacts.md, and replace each page's copy with a link to contacts.md.
    checks:
      reads: [organize]
      file_contains:
        contacts.md: ['07700 900123', '07700 900456', '999', '07700 900789']
        lakes-weekend.md: ['^(?![\s\S]*07700 900456)[\s\S]*contacts\.md', '550 m of ascent']
        snowdon-day.md: ['^(?![\s\S]*07700 900456)[\s\S]*contacts\.md', '750 m of ascent']
        peak-walk.md: ['^(?![\s\S]*07700 900456)[\s\S]*contacts\.md', '350 m of ascent']
    rubric:
      - {id: map-reported, tag: organize, criterion: 'Does the answer tell the user what moved where, such as the contacts now in contacts.md and a link in place of each page''s copy? Pass if it says both. Fail if it does not say what moved where.'}
      - {id: check-reported, tag: organize, criterion: 'After applying the change, does the answer report how the agent checked the result, such as comparing the old and new text, and what that check found? Pass if both the check and its finding are there. Fail if either is missing, or if nothing was changed in this turn.'}
