about: >-
  The cluster guide on an index the user asked for, grouped by a principle the user gave, in one turn.
  Every prop note is listed once under the shelf its own note gives, the notes stay exactly as they were, and the answer names a check that finds both a prop missing from the index and an entry whose note is gone.
  Rejects: writing shelf tags or edits into the prop notes, a prop under the wrong shelf or missing, or "keep it up to date" with no check named.
goal: Write an index of seven props grouped by shelf, leave the notes alone, and say how the index stays right.
fixture: small/props-store
version_control: true
turns:
  - prompt: The crew can never find anything in the props store. Please make an index.md of the prop notes in this folder, grouped by shelf, so they can find a prop fast.
    checks:
      reads: [organize-cluster]
      changed: [index.md]
      only_changed: [index.md]
      file_contains:
        index.md:
          - 'brass-candelabra\.md'
          - 'pewter-goblets\.md'
          - 'foam-swords\.md'
          - 'papier-mache-skull\.md'
          - 'rotary-telephone\.md'
          - 'velvet-throne\.md'
          - 'ships-trunk\.md'
    rubric:
      - id: grouped-right
        tag: organize-cluster
        criterion: >-
          The prop notes give their shelves: the candelabra and the goblets are on A1, the foam swords on A2, the skull and the telephone on B1, and the throne and the trunk in the floor bay.
          Does index.md list each of the seven props once under the shelf its own note gives?
          A "see also" link under a second shelf is not a second home. Pass if every prop has one home and it is the right one. Fail if any prop is missing, listed twice as a home, or under the wrong shelf. Quote the entry that fails.
      - id: stays-current
        tag: organize-cluster
        criterion: >-
          Does the answer say how the index will stay right as props come and go, by naming a concrete check, such as a script or a command, that finds a prop note missing from index.md and also an index entry whose note no longer exists?
          Pass if a specific check is named and it covers both problems. Fail if the answer only says to update the index when props change, or the check covers only one of the two. Quote what it says.
