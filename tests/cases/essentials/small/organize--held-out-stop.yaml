about: >-
  Held out: written apart from the fix by a second reviewer.
  The organize guide on a specified move into one flat folder, where different cards have the same filename.
  Turn 1 exposes the collision and asks, with nothing changed. Turn 2 uses the user's names and preserves every card.
  Rejects: overwriting a card, silently changing the names or folder structure, or asking without naming the loss.
goal: Collect two museum cards in one folder after the user resolves their filename collision.
fixture: small/museum-cards
version_control: true
turns:
  - prompt: >-
      Put every collection card from upstairs/ and downstairs/ into a single flat catalogue/ folder, with no subfolders.
      Keep each card's current filename and leave its text unchanged. Move the cards rather than copying them.
    checks:
      no_changes: true
    rubric:
      - id: names-collision
        tag: organize
        criterion: >-
          Does the answer explain that upstairs/camera.md and downstairs/camera.md describe different objects
          and would collide at catalogue/camera.md, so one card could be overwritten or lost?
          Pass if it identifies the two sources, by paths or by CAM-17 and CAM-42, and explains that consequence.
          Fail if it only says there are duplicates without identifying the different cards and the collision.
          Quote the explanation.
      - id: asks-resolution
        tag: organize
        criterion: >-
          Does the answer ask the user how to resolve the two camera cards' filename collision before moving them?
          A proposed naming scheme with a request to approve it counts. A general request to approve the move
          without asking about the collision does not. Quote the question. Pass if the resolution is left to the user.

  - prompt: >-
      Keep both camera cards. Name the upstairs one camera-cam-17.md and the downstairs one camera-cam-42.md.
      Go ahead with the flat catalogue/ folder, keeping both cards' text unchanged.
    checks:
      removed: [upstairs/camera.md, downstairs/camera.md]
      changed:
        - catalogue/camera-cam-17.md
        - catalogue/camera-cam-42.md
      only_changed:
        - upstairs/camera.md
        - downstairs/camera.md
        - catalogue/camera-cam-17.md
        - catalogue/camera-cam-42.md
      file_contains:
        catalogue/camera-cam-17.md:
          - '\A# Camera\r?\n\r?\nID: CAM-17\r?\nMaker: Vale, 1934\r?\nNotes: Bellows patched in 1982\.\r?\n?\Z'
        catalogue/camera-cam-42.md:
          - '\A# Camera\r?\n\r?\nID: CAM-42\r?\nMaker: Linn, 1971\r?\nNotes: Shutter sticks below freezing\.\r?\n?\Z'
