about: >-
  The organize guide on a split the user named exactly, in one turn: the request approves it, so the split is made, the retired file says where its recipes went,
  and the answer reports how the result was checked and what the check found. Rejects: a stop for leave, or a report with no check.
goal: Split one recipe file into one file per recipe, losing nothing.
fixture: small/recipe-notes
turns:
  - prompt: Please split recipes.md into one file per recipe, in a recipes/ folder.
    checks:
      reads: [organize]
      file_contains:
        recipes.md: ['recipes/']
      written_under:
        recipes/: 5
    rubric:
      - {id: nothing-lost, tag: organize, criterion: 'recipes.md held five recipes, each with its ingredients and a method line, such as "Grandma adds a squeeze of lemon at the end" and "The first one is always a test pancake". Do the files written in this turn keep every recipe with all its ingredients and its method line? Pass if nothing is missing or changed in meaning. Fail if anything is, and quote what is missing. Answer unknown if no file was written in this turn.'}
      - {id: map-reported, tag: organize, criterion: 'Does the answer tell the user where each recipe went, such as a list of the new files by recipe? Pass if every recipe is placed. Fail if it does not say where the recipes went.'}
      - {id: check-reported, tag: organize, criterion: 'After applying the change, does the answer report how the agent checked the result, such as comparing the old and new text or counting recipes, and what that check found? Pass if both the check and its finding are there. Fail if either is missing, or if nothing was changed in this turn.'}
