about: The organize guide on a split, over two turns, propose then apply; approval first, then a checked result and a confirmation request.
goal: Split one recipe file into one file per recipe, losing nothing.
fixture: small/recipe-notes
turns:
  - prompt: Please split recipes.md into one file per recipe, in a recipes/ folder.
    checks:
      reads: [organize]
      no_changes: true
    rubric:
      - {id: map-first, tag: organize, criterion: 'Before changing any file, the answer shows where each item will go and asks the user to approve. Pass if no file is changed in this turn and both the map and the approval question are there.'}
  - prompt: Yes, that looks right. Go ahead.
    checks:
      file_contains:
        recipes.md: ['recipes/']
    rubric:
      - {id: checked-then-confirm, tag: organize, criterion: 'After applying the change, the answer reports how the agent checked the result, such as comparing the old and new text or counting items, and what that check found. It then asks the user to confirm the result and does not call the work confirmed or finished before the user replies. Pass if both the check and the request for confirmation are there. Fail if either is missing.'}
