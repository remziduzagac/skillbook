about: >-
  The enrich guide on a bare README, in two turns.
  First it lists what a new reader would need, each addition with its source, and changes nothing.
  The current files give Python 3.11 or newer and the run command; an old 2021 note in docs/ says Python 2.7 and a library that is gone, so it is named as outdated and not used.
  After approval the README gets the current steps only.
  Rejects: filling the README at once, adding the old note's steps because they have a source, or an addition with no source.
goal: Propose README additions from the current files with sources, name the old note as outdated, then apply the list.
fixture: small/invoice-readme-thin
turns:
  - prompt: The README for my invoice script is bare. Fill it in so someone new can set the script up and run it.
    checks:
      reads: [act-rightsize-enrich]
      unchanged: [README.md, invoices.py, pyproject.toml, docs/old-setup.txt]
    rubric:
      - id: current-python
        tag: act-rightsize-enrich
        criterion: >-
          pyproject.toml says the project needs Python 3.11 or newer, while docs/old-setup.txt, from 2021, says Python 2.7.
          Does the proposal give Python 3.11 or newer as the Python requirement to add?
          Pass if the requirement it proposes is 3.11 or newer.
          Fail if it proposes Python 2.7 or proposes no Python requirement, and quote the item.
      - id: old-note-outdated
        tag: act-rightsize-enrich
        criterion: >-
          Does the answer propose none of the old note's steps (easy_install, reportlab, python2, make_invoices.py) as an addition, and name docs/old-setup.txt as outdated or contradicted by the current files?
          Pass if it adds none of those steps and names the old note as outdated or contradicted.
          Fail if any of those steps is proposed as an addition, and quote it.
          If the answer adds none of those steps and never mentions the old note, return unknown.
      - id: source-each
        tag: act-rightsize-enrich
        criterion: >-
          Does each proposed addition name where it comes from, such as a project file, a section of one, or a command that was run? A file named for each addition is enough.
          Pass if every addition names one.
          Fail if any addition has no source, and quote the first one without.
      - id: asks-approval
        tag: act-rightsize-enrich
        criterion: >-
          Does the answer ask the user to approve the list before anything is changed?
          Pass if it asks for approval, or says it will fill the README once the user agrees.
          Fail if it says the README is already filled or asks nothing, and quote the part that decides.
  - prompt: Yes, apply that list.
    checks:
      changed: [README.md]
      unchanged: [invoices.py, pyproject.toml, docs/old-setup.txt, clients.csv, jobs.csv]
      file_contains:
        README.md:
          - '3\.11'
          - '--month'
          - '(?i)^(?![\s\S]*(easy_install|install\s+reportlab))'
