about: >-
  The setup guide on a request to look at a setup and change nothing.
  The answer says what it saw, lists the check that only a fresh session can settle with who can run it, and reads no project sources.
  Rejects: calling the setup working because the files are there, a pending check with no one to run it, or reading the project's episodes as for a project setup.
goal: Report on the install without changing anything, and name the check that stays pending.
fixture: small/podcast-slow-boats
checks:
  names_no_skill: false
turns:
  - prompt: Can you tell me whether my essentials skill is installed and will load in this folder? I only want a report, nothing changed.
    checks:
      reads: [coordinate-setup]
      no_changes: true
    rubric:
      - id: pending-check-has-owner
        tag: coordinate-setup
        criterion: >-
          Files and folders alone do not show that a session loads the essentials skill.
          Does the answer rest "working" on more than the files it saw: a session it saw load the skill, such as its own, or a check it names as still to do, with who can run it?
          Pass if it does either. Fail if it calls the setup working from the files and folders it saw alone. Quote the sentence.
      - id: reads-only-install-and-pointer
        tag: coordinate-setup
        criterion: >-
          A look at the setup needs only the install folders and the instruction files that hold the pointer.
          Do the actions show the agent opening any other project file, such as the episodes, the transcripts or guests.md?
          Pass if no such file is opened. Fail if one is, and name it.
