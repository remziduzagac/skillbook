about: >-
  The devise-plan guide on work with several dependent parts and no steps given, in one turn. Nothing needs the user's decision first and the change is small,
  so the work goes ahead; the answer gives each step with its result, and the old settings file is left alone. Rejects: a stop for leave, or a report with no steps.
goal: Move a small reminder tool from an INI settings file to a JSON settings file.
fixture: small/reminder-tool
turns:
  - prompt: Please switch the reminder tool from settings.ini to a settings.json file with the same values. Leave settings.ini in place for now.
    checks:
      reads: [devise-plan]
      file_contains:
        reminder.py: ['settings\.json']
        settings.json: ['Larkfield Chess Club', 'Thursday', '7:45']
      unchanged: [settings.ini]
    rubric:
      - id: steps-reported
        tag: devise-plan
        criterion: >-
          Does the answer report the steps of the work it did, each with its result, such as the new file written and the script changed to read it?
          Pass if it names two or more steps with what each produced. Fail if it only says the work is done, or asks leave to start it, and quote what it gives.
