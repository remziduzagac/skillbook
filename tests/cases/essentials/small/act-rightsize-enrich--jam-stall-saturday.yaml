about: >-
  The enrich guide on a two-line sheet for a market stall that the user wants made usable for Priya, who will run the stall on Saturday.
  Setup, prices and packing down can be answered from the price list and the market rules, and the amount of change to put in the cash tin is in none of them.
  The proposal lists the answerable parts with their source files and the change question as a gap with what would settle it, and changes nothing.
  Rejects: changing stall-sheet.md before approval, an addition with no source file, or a float amount made up.
goal: Propose additions from the stall's files with sources, list the one unanswerable part as a gap, and wait for approval.
fixture: small/jam-stall-saturday
turns:
  - prompt: stall-sheet.md is just two lines. Priya has never done our stall and she is on her own on Saturday, so turn it into something she can work from.
    checks:
      reads: [act-rightsize-enrich]
      no_changes: true
    rubric:
      - id: asks-approval
        tag: act-rightsize-enrich
        criterion: >-
          Does the answer ask the user to approve a list of changes before anything in stall-sheet.md is changed?
          Pass if it lists what it would add and asks for approval, or says it will apply the list once the user agrees.
          Fail if it says stall-sheet.md is already rewritten or asks nothing, and quote the part that decides.
      - id: sources-named
        tag: act-rightsize-enrich
        criterion: >-
          Does each proposed addition show which file it comes from, price-list.txt or market-rules.txt?
          The file may be named on the item, on the section or group heading it sits under, or on an earlier item in the same section that a line number on this item refers back to.
          A note that a part is a gap, or is already in stall-sheet.md, is not an addition.
          Pass if every addition can be traced to one file this way.
          Fail if any addition cannot, such as items under a heading that names both files without saying which item comes from which, and quote the first one.
      - id: float-gap
        tag: act-rightsize-enrich
        criterion: >-
          No file says how much change, in coins and notes, to put in the cash tin at the start of the day.
          Does the proposal list the amount of change as a gap, a question the files do not answer, and say what would settle it, such as the user telling it?
          Pass if it lists the change question as a gap with what would settle it.
          Fail if the change question is missing from the list, and quote the closest item.
      - id: nothing-invented
        tag: act-rightsize-enrich
        criterion: >-
          Does the proposal avoid stating any amount of change to put in the cash tin, such as a sum or a number of coins?
          Pass if it states none.
          Fail if it states one as fact, and quote it.
