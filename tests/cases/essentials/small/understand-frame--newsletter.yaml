about: The frame guide on a community project with no code; each proposed measure and exclusion is marked as a guess.
goal: Frame the problem before writing, with guesses marked one by one.
fixture: small/street-newsletter
turns:
  - prompt: Our street wants a monthly newsletter. The meeting notes are in notes.md. Before I write anything, help me frame what it is for and how we would know it works.
    checks:
      reads: [understand-frame]
      answer_contains: ['\(guess\)']
    rubric:
      - {id: measures-marked, tag: understand-frame, criterion: 'The notes give no way to tell the newsletter works, so a measure in the answer is the agent''s own proposal, unless it only restates a limit the notes give, such as printing at the library within its cost. Proposals include counting copies delivered, asking households whether they heard in time, or a notice period. Does each line, list item or table row that proposes a measure carry a guess mark? A guess mark is the word "guess" in brackets, such as "(guess)" or "(Guess.)"; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. One label over a list, table or section, such as "all guesses", does not mark the items under it. An anti-goal, a way the result could work yet fail, counts as a measure. The goal line, the unknowns, and questions to the user with their recommended answers are not judged here. Pass if every one is marked. Fail if any is not, and quote it. If the answer proposes no measure, return unknown.'}
      - {id: scope-marked, tag: understand-frame, criterion: 'Does each line or list item that says something is out of scope or left out of the work carry a guess mark, unless the notes state that exclusion? The notes rule out a WhatsApp group and any budget beyond library printing; those need no mark. Anything else ruled out is the agent''s own choice, such as a website or event planning. A guess mark is the word "guess" in brackets, such as "(guess)" or "(Guess.)"; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. One label over a list, table or section, such as "all guesses", does not mark the items under it. Questions to the user, with their recommended answers, are not judged here. Pass if every such exclusion is marked. Fail if any is not, and quote it. If the answer puts nothing else out of scope, return unknown.'}
      - {id: parts-filled, tag: understand-frame, criterion: 'The answer covers the problem, the goal, what is out of scope, the constraints and what a good result looks like. A part the agent cannot fill is marked unknown, not left out. Pass if all five are there, filled or marked unknown.'}
