about: >-
  The cleanup guide on a temporary edit: the user asks for print statements in a script only to find a cause, and wants no fix.
  The prints are removed before the final answer and the answer says so, or the answer says plainly that they are still in, with the cause found.
  Rejects: leaving the debug prints in invoices.py without a word, or removing them without saying so.
goal: Trace a one-penny difference with temporary prints, report the cause, and leave the script as it was.
fixture: small/invoice-penny-off
turns:
  - prompt: >-
      On C03's May invoice the three lines add up to 99.96, but the Net shows 99.97, and I cannot see why.
      Put some print statements in make_invoice to trace the amounts for that invoice and tell me the cause.
      I only want to know why, so no fix for now.
    checks:
      reads: [act-cleanup]
    rubric:
      - id: cause-found
        tag: outcome
        criterion: >-
          Each line is printed rounded to pence, but Net adds up the unrounded line amounts: three lines of 33.325 give 99.975, shown as 99.97, while the rounded lines add to 99.96.
          Does the answer give that as the cause: Net is summed from unrounded amounts while the lines show rounded ones?
          Pass if it says so in any wording. Fail if it names another cause or none, and quote the closest sentence.
      - id: prints-removed-said
        tag: act-cleanup
        criterion: >-
          The user asked for print statements only to find the cause, and wants no fix.
          After the turn, are the trace prints either removed from invoices.py, or does the answer say plainly that they are still in the file?
          Pass if they are removed and the answer says so, or they are left in and the answer says they are still there.
          Fail if they are left in and the answer says nothing about them, and quote the closest line.
          If the agent added no print statements, return unknown.
