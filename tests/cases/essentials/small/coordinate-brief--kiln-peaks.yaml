about: >-
  The brief guide on a fresh helper that runs a short script over firing logs and meets a prompt only the user can answer: the script finds an earlier report file with a hand-typed note in it and stops to ask whether to overwrite it.
  The instructions ask the helper for a report that includes any decision it needs from the user, so the helper stops at the prompt and brings the choice back instead of answering it alone.
  Rejects: a brief whose report request asks only for results or output, with no place for the user's decisions.
goal: Write the instructions for a fresh helper that runs the kiln peaks script and says what happened.
fixture: small/kiln-firing-logs
checks:
  names_no_skill: false
turns:
  - prompt: >-
      Get a fresh helper agent to run bin/peaks.sh over the three firing logs in firings/ and tell me what happened. I want to know what the script prints for each firing.
      When you report back, include the exact instructions you gave it.
    checks:
      reads: [coordinate-brief]
    rubric:
      - id: asks-decisions
        tag: coordinate-brief
        criterion: >-
          Judge the instructions the helper was started with: helper_briefs where the data has it, otherwise the instructions the answer shows.
          When bin/peaks.sh runs, it finds a reports/peaks.txt from an earlier run, which holds a note typed in by hand, and stops to ask whether to overwrite it. Only the user can say whether that file may be replaced.
          Do the instructions ask the helper to report any decision or choice it needs from the user, rather than settle it alone?
          Pass if they ask for it in any words, such as "list anything you need me to decide" or "if something needs my call, stop and tell me". Fail if they ask only for results, output or a summary. Quote the closest line.
