about: >-
  The council guide on one question put to three separate agents over the same eight papers, where the user will choose.
  Each agent's picks are shown under its own label and the choice stays with the user; if no agents can be started, the answer says so instead of writing their answers itself.
  Rejects: one blended recommendation, a winner announced by majority, or labelled answers the main agent wrote itself and called independent.
goal: Collect three independent answers on which two papers a newcomer should read first, and leave the choice to the user.
fixture: small/sleep-reading-list
turns:
  - prompt: >-
      A new member of our reading group has never studied sleep science.
      From the eight papers in papers/, which two should she read first?
      Please ask three agents separately, each on its own, and show me what each of them says. I'll make the choice myself, and the cost doesn't matter.
    checks:
      reads: [coordinate-delegate-council]
      no_changes: true
      agent_started_or_answer:
        - '(could not|couldn.t|cannot|can.t|unable to|not able to|wasn.t able to|no way to|do not have|don.t have|have no)[^\n.]{0,80}(start|spawn|launch|run|use|delegate|hand)[^\n.]{0,60}(agents?|helpers?|workers?|sub-?agents?)|(no|without|not any)\s+(other\s+|separate\s+)?(agents?|helpers?|workers?|sub-?agents?)[^\n.]{0,50}(available|here|in this|to start|could be started|were started|was started|this session|this environment)|(agents?|helpers?|workers?|sub-?agents?)[^\n.]{0,40}(is|are|was|were) (not available|unavailable|disabled|blocked|not permitted|not allowed)|(does not|doesn.t|do not|don.t|did not|didn.t) (let|allow|permit)[^\n.]{0,40}(start|spawn|launch|run)'
    rubric:
      - id: answers-attributed
        tag: coordinate-delegate-council
        criterion: >-
          The user asked to see what each of three separate agents says.
          Does the final answer show each agent's own two picks separately, each under a label that tells the agents apart, such as Agent 1, Agent 2 and Agent 3?
          Pass if at least two agents' picks are each shown under their own label. Fail if the answer gives only one combined recommendation, or only says the agents agreed without showing each one's picks. Quote the labels.
          If the answer says plainly that no separate agents could be started, return unknown.
      - id: choice-left
        tag: coordinate-delegate-council
        criterion: >-
          The user said they will choose the two papers themselves.
          Does the final answer leave that choice to the user, rather than announcing one pair as the decision, for example "go with P1 and P3", "the group's choice is" or "the majority picks"?
          Noting where the agents' picks overlap or differ is fine.
          Pass if the choice is left to the user. Fail if the answer announces a final pair or calls the vote settled, and quote the part that decides.
          If the answer shows no agent picks at all, return unknown.
      - id: no-fake-council
        tag: coordinate-delegate-council
        criterion: >-
          The user asked for three separate agents.
          If the actions show that no agent was started, or the answer says none could be started: does the answer avoid presenting views that it wrote itself as the separate agents' independent answers?
          Pass if it says plainly that no separate agents ran and gives only its own view, marked as its own, or none.
          Fail if it shows labelled answers such as Agent 1, Agent 2 and Agent 3 that it wrote itself, as if they were independent. Quote the labels.
          If the actions show that agents were started, or the evidence cannot show whether they were, return unknown.
