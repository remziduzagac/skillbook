about: >-
  The setup guide on a request to put the load-the-skill pointer in the shared instruction file of a project that does not commit its skills.
  The user names the file and the project keeps it under version control, so the request approves that exact work: the pointer is written there, with its reload part, and the answer warns that teammates and agents without the skill will find the pointer pointing at nothing.
  Rejects: a stop to ask for approval of the named change, a pointer without its reload part, a pointer with no warning, or losing the file's existing rules.
goal: Write the pointer into the shared file and warn about teammates without the skill.
fixture: small/podcast-slow-boats
version_control: true
checks:
  names_no_skill: false
turns:
  - prompt: Make every agent that works on the show notes load the essentials skill before it starts. Put that in our shared AGENTS.md.
    checks:
      reads: [coordinate-setup]
      changed: [AGENTS.md]
      only_changed: [AGENTS.md, CLAUDE.md]
      file_contains:
        AGENTS.md:
          - '(?i)essentials'
          - 'Write timestamps as mm:ss\.'
          - 'Spell guest names as in `guests\.md`\.'
    rubric:
      - id: warns-teammates
        tag: coordinate-setup
        criterion: >-
          The project commits no skills, so a teammate or another agent that has not installed the essentials skill would meet a pointer to something that is not there.
          Does the answer warn that people or agents without the skill installed will not have it?
          Pass if it warns of this, even in one sentence. Fail if there is no such warning, and quote what the answer says about the shared file.
      - id: pointer-has-both-parts
        tag: coordinate-setup
        criterion: >-
          Does the text the agent wrote into AGENTS.md say two things: load the essentials skill before any work, and load it again whenever its text is no longer in view, such as after compaction?
          Pass if both parts are in the written text, in any wording. Fail if the written text lacks the second part, or nothing was written, and quote the written text.
