about: The frame guide on a club losing members, held out from the change it tests; each proposed measure and exclusion is marked as a guess.
goal: Frame the problem before changing the club, with guesses marked one by one.
fixture: small/book-club
turns:
  - prompt: Read club-notes.md. I want to fix our book club before the new season starts. Help me frame the problem first, and how we would tell it is working again.
    checks:
      reads: [understand-frame]
      answer_contains: ['\(guess\)|guesses']
    rubric:
      - {id: measures-marked, tag: understand-frame, criterion: 'The notes give no way to tell the club is working again, so a measure in the answer is the agent''s own proposal, unless it only restates a limit the notes give, such as the organiser''s two hours a month. Proposals include a number of members, how many finish the book, or a trial over a few meetings. Does each line, list item or table row that proposes a measure carry a guess mark? A guess mark is the word "guess" in brackets after the item, such as "(guess)" or "(Guess.)", or a label over it as described next; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. A label over a list, table or section that calls its items guesses, such as "Guesses" or "all guesses", marks every item under it when every one of them is the agent''s own proposal; over a list that mixes given facts with guesses, it marks none. An anti-goal, a way the result could work yet fail, counts as a measure. The goal line, the unknowns, and questions to the user with their recommended answers are not judged here. Pass if every one is marked. Fail if any is not, and quote it. If the answer proposes no measure, return unknown.'}
      - {id: scope-marked, tag: understand-frame, criterion: 'Does each line or list item that says something is out of scope or left out of the work carry a guess mark, unless the notes state that exclusion? The notes rule out spending money on books; that needs no mark. Anything else ruled out is the agent''s own choice, such as online meetings or a second group. A guess mark is the word "guess" in brackets after the item, such as "(guess)" or "(Guess.)", or a label over it as described next; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. A label over a list, table or section that calls its items guesses, such as "Guesses" or "all guesses", marks every item under it when every one of them is the agent''s own proposal; over a list that mixes given facts with guesses, it marks none. Questions to the user, with their recommended answers, are not judged here. Pass if every such exclusion is marked. Fail if any is not, and quote it. If the answer puts nothing else out of scope, return unknown.'}
      - {id: parts-filled, tag: understand-frame, criterion: 'The answer covers the problem, the goal, what is out of scope, the constraints and what a good result looks like. A part the agent cannot fill is marked unknown, not left out. Pass if all five are there, filled or marked unknown.'}
      - id: given-facts-unmarked
        tag: understand-frame
        criterion: >-
          The notes give these facts: the club started two years ago at the library; fourteen people came to the first meetings and the last three had 6, 5 and 6; two people who stopped coming said the books were too long to finish in a month; one member said Thursday at 7pm clashes with her evening class; the library room is free and there is no money for books; the organiser runs it alone with about two hours a month.
          Does the answer leave each of these given facts without a guess mark? A guess mark is the word "guess" in brackets after an item, such as "(guess)", or a label such as "Guesses" over a list.
          A marked line that adds the agent's own inference or proposal to a given fact, such as a cause or a target, is not a fail.
          Pass if no given fact, as the notes state it, is marked as a guess. Fail if one is, and quote it.
