about: >-
  Held out: written apart from the guide text, for new work written from an agreed brief.
  The user asks for a running order, a new file, from parade-brief.md, which fixes the times and the road closure and says nothing on when the stewards arrive or on wet weather.
  The brief is not material to fill, so the plan goes ahead at once, with no list of scope or additions to approve first.
  Rejects: stopping with an approval list for adding to the brief, editing the brief, a plan that drops a fixed time, or changing other files.
goal: Write the evening's running order as a new file from the agreed brief, keeping its fixed times and leaving the brief as it is.
fixture: small/lantern-parade-brief
turns:
  - prompt: The street committee agreed the lantern parade in parade-brief.md. Please write the evening's running order from it as a new file, running-order.md, for the stewards to follow.
    checks:
      changed: [running-order.md]
      only_changed: [running-order.md]
      unchanged: [parade-brief.md]
      file_contains:
        running-order.md:
          - '(?is)17[:.]45.{0,100}lantern|lantern.{0,100}17[:.]45'
          - '(?is)18[:.]25.{0,100}(choir|song)|(choir|song).{0,100}18[:.]25'
          - '19[:.]15'
    rubric:
      - id: no-scope-ask
        tag: act-rightsize
        criterion: >-
          The user asked for a new running order, written from parade-brief.md, and named the new file.
          The brief fixes the evening's times; it says nothing about when the stewards arrive or about wet weather.
          Does the answer stop before writing running-order.md to ask the user to approve a list of what the running order will cover, or a list of additions to the brief?
          Pass if it writes the file without that stop; a question after the file is written about something the brief leaves open is not a stop.
          Fail if it ends the turn with a scope or additions list for approval, or says it will write the running order once the user agrees, and quote the list or the offer.
