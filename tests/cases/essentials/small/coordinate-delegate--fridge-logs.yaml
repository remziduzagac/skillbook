about: >-
  The coordinate-delegate guide on a read-only check across sixteen weekly fridge logs of about 140 lines each, long reading that fits none of the reasons to do a part yourself.
  Other agents do the reading, or the answer says why they did not, and the answer lists the three readings above 5 °C with no Action line and separates what it confirmed from what it took on a helper's word.
  Rejects: reading every log here with no word about helpers, a missed reading, a reading reported that has its Action line, or a helper's report passed on as confirmed when nothing was checked.
goal: Find the three readings above 5 °C that have no Action line, with the reading handed over and its result checked, and change no files.
fixture: small/fridge-logs
turns:
  - prompt: >-
      The food-safety inspector visits on Monday. Go through all the weekly logs in logs/ and list every reading above 5 °C that has no Action line after it: the date, time, fridge and reading. Change no files.
    checks:
      reads: [coordinate-delegate]
      no_changes: true
    rubric:
      - id: finds-exact-readings
        tag: coordinate-delegate
        criterion: >-
          Exactly three readings above 5 °C have no Action line: Thursday 22 January 2026 at 11:30, Fridge 4 (donations), 6.4 °C;
          Saturday 28 February 2026 at 15:00, Fridge 3 (sandwiches), 7.2 °C; Sunday 12 April 2026 at 08:00, Fridge 4 (donations), 5.3 °C.
          Three other readings above 5 °C (5.8, 6.1 and 5.6 °C) each have an Action line, so they must not be listed as missing one.
          Does the answer list exactly the three readings without an Action line, each with its date, time, fridge and reading?
          Pass if all three are there and correct and no reading with an Action line is listed as missing one. Fail if one is missing or wrong, or if any other reading is listed, and name which.
      - id: helper-findings-status
        tag: coordinate-delegate
        criterion: >-
          If the answer relies on another agent's report, does it say which findings the main agent confirmed itself, for example by reading the log line, or say plainly that they are unchecked?
          Pass if the answer separates confirmed findings from unchecked ones, or says it re-read the cited lines.
          Fail if it gives a helper's findings as established with no check and no caveat, and quote the line.
          If the answer uses no other agent, return unknown.
      - id: helper-or-reason
        tag: coordinate-delegate
        criterion: >-
          Do the actions show that another agent did part of the reading, or does the final answer say that the work was done here and give a reason why no other agent was used?
          A reason says why, such as "one search printed only a few lines" or "no agents can be started here". Saying only that the files were checked directly, or how they were checked, is not a reason.
          Pass if another agent did part of the work, or such a reason is given. Fail if the work was done here with no reason, and quote the closest line.
