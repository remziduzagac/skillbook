about: >-
  The normalize guide on a log function copied into five scripts, where one of the five runs on another machine: nightly.sh sends remote-prune.sh over ssh, so it cannot load a shared file kept in this folder.
  The request names the arrangement, so the agent gives the function one home, and remote-prune.sh still gets the function on the vault box.
  Rejects: copies left in the local scripts, or remote-prune.sh made to source a local file that will not exist on the vault box.
goal: Give a repeated function one home, and keep the script that runs elsewhere working.
fixture: small/backup-log-scripts
turns:
  - prompt: All five of my backup scripts define the same log function. Keep it in one place instead of five copies.
    checks:
      reads: [organize-normalize]
      changed: [backup-home.sh, backup-music.sh, check-disk.sh, rotate-exports.sh]
      file_contains:
        backup-home.sh: ['^(?![\s\S]*\nlog\(\)\s*\{)']
        backup-music.sh: ['^(?![\s\S]*\nlog\(\)\s*\{)']
        check-disk.sh: ['^(?![\s\S]*\nlog\(\)\s*\{)']
        rotate-exports.sh: ['^(?![\s\S]*\nlog\(\)\s*\{)']
    rubric:
      - id: remote-script-caught
        tag: organize-normalize
        criterion: >-
          nightly.sh sends remote-prune.sh to another machine over ssh, so remote-prune.sh cannot simply load a shared file kept in this folder.
          After the change, does remote-prune.sh still get the log function when it runs there, such as by keeping its own copy or by nightly.sh sending the shared file with it?
          Pass if it does, and the answer says why remote-prune.sh is handled differently. Fail if remote-prune.sh sources a local file that nightly.sh does not send, or the answer never mentions remote-prune.sh, and quote the part that decides.
