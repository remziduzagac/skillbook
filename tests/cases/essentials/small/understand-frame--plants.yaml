about: The frame guide on a personal app idea; each proposed measure and exclusion is marked as a guess.
goal: Frame the problem before design, with guesses marked one by one.
fixture: small/plant-notes
turns:
  - prompt: Read notes/idea.md. Before we design anything, help me pin down the problem and what a good result would look like.
    checks:
      reads: [understand-frame]
      answer_contains: ['\(guess\)']
    rubric:
      - {id: measures-marked, tag: understand-frame, criterion: 'The notes give no way to tell the result worked, so a measure in the answer is the agent''s own proposal, unless it only restates a limit the notes give, such as costing nothing. Proposals include a trial period, a count of missed waterings or a time limit. Does each line, list item or table row that proposes a measure carry a guess mark? A guess mark is the word "guess" in brackets, such as "(guess)" or "(Guess.)"; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. One label over a list, table or section, such as "all guesses", does not mark the items under it. An anti-goal, a way the result could work yet fail, counts as a measure. The goal line, the unknowns, and questions to the user with their recommended answers are not judged here. Pass if every one is marked. Fail if any is not, and quote it. If the answer proposes no measure, return unknown.'}
      - {id: scope-marked, tag: understand-frame, criterion: 'The notes put nothing out of scope, so every exclusion in the answer is the agent''s own choice, such as plant care beyond watering, sensors, or choosing an app for now. An open question left for later is not an exclusion. Does each line or list item that says something is out of scope or left out of the work carry a guess mark? A guess mark is the word "guess" in brackets, such as "(guess)" or "(Guess.)"; other words, such as "suggested", are not a mark. A mark covers the frame part, list item or table row it ends, even when that part wraps over several lines. One label over a list, table or section, such as "all guesses", does not mark the items under it. Leaving the choice of an app or its design for later needs no mark: the user asked to pin down the problem before designing. Questions to the user, with their recommended answers, are not judged here. Pass if every one is marked. Fail if any is not, and quote it. If the answer puts nothing out of scope, return unknown.'}
      - {id: parts-filled, tag: understand-frame, criterion: 'The answer covers the problem, the goal, what is out of scope, the constraints and what a good result looks like. A part the agent cannot fill is marked unknown, not left out. Pass if all five are there, filled or marked unknown.'}
