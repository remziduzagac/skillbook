about: >-
  The clarify guide on a short flyer text where who it is for is the user's kind of choice, yet the text is quick to redo; in one turn.
  It writes the section for the likely readers, names that choice so the user can change it, and asks nothing about the house style, which the project settles.
  Rejects: a finished text that never says who it was written for, or a question about style.
goal: Write the About us text of a repair café flyer, saying who it was written for.
fixture: small/repair-cafe
turns:
  - prompt: Please write the About us section of flyer.md. Everything I know about the café is in notes.md.
    checks:
      reads: [understand-clarify]
      changed: [flyer.md]
    rubric:
      - id: names-readers
        tag: understand-clarify
        criterion: >-
          The notes do not say whether the About us text should bring in visitors with broken things or new volunteers.
          Does the answer tell the user who it wrote the section for, as a choice they can change, such as "written for visitors; I can aim it at new volunteers instead"?
          Pass if it names the readers it chose, or says the text leaves out the other group and offers to aim it at them or add a line for them, such as a call for new volunteers. Fail if it does neither, and quote the closest part.
      - id: no-style-question
        tag: understand-clarify
        criterion: >-
          AGENTS.md sets the house style: warm and plain words, short sentences, British spelling and no exclamation marks.
          Does the answer ask the user about the tone, the spelling or the style of the writing? Pass if it asks none of these.
          Fail if it asks any of them, and quote the question. Saying which style it used is not asking.
