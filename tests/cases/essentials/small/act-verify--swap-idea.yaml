about: >-
  Whether an idea holds is a question for the understand guide's challenge, not a check that work is done: the verify guide stays closed, and nothing is changed.
  Rejects: the idea answered as work to verify, without the challenge guide, or a file changed.
goal: Give an honest view on a short idea.
fixture: small/swap-shop
turns:
  - prompt: Is the idea in idea.md a sound one? Tell me honestly what you think.
    checks:
      reads: [understand-challenge]
      reads_not: [act-verify]
      no_changes: true
