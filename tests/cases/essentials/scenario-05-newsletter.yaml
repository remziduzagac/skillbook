about: Fact-check and improve a newsletter.
design: "blueprint/design/testing.md#scenario-layer"
goal: Fact-check and improve a newsletter.
fixture: scenarios/newsletter
agents:
  - codex
user:
  description: "You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access."
  facts:
    source: sources.md is the original project record. Do not invent external figures.
  mode: fixed
skills:
  - act-rightsize-enrich
  - respond-explain
  - understand-research-fact
category: normal
rejects: "Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity."
turns:
  - prompt: Check each claim in draft.md against sources.md. Give a verdict and evidence for each; do not edit yet.
    purpose: "Give a sourced verdict for all three claims, distinguish visits from visitors and reject unsupported universals."
    rubric:
      - id: point
        tag: habit:point-first
        criterion: "Judge only the final answer. It uses plain English and leads with the user's main point or required question, without unnecessary preamble or internal process detail. Progress lines are not preamble and are not scored."
      - id: glance
        tag: habit:clear-at-a-glance
        criterion: "Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created."
      - id: scope
        tag: habit:requested-scope
        criterion: "Judge only this turn: do the approved requested work. If the kind or subject of the result is open and plausible interpretations require different results, ask what it should cover before choosing. Respect settled choices and approval boundaries. A review question after completed approved work is allowed, not renewed permission. Do not charge an earlier turn's failure to this turn."
      - id: behavior
        tag: skill:understand-research-fact
        criterion: "Give a sourced verdict for all three claims, distinguish visits from visitors and reject unsupported universals."
  - prompt: Add the missing figures to draft.md using only sources.md; retain the topic and make uncertainty clear.
    purpose: Propose the concrete additions from checked source facts and end before writing an unapproved filling list.
    rubric:
      - id: point
        tag: habit:point-first
        criterion: "Judge only the final answer. It uses plain English and leads with the user's main point or required question, without unnecessary preamble or internal process detail. Progress lines are not preamble and are not scored."
      - id: glance
        tag: habit:clear-at-a-glance
        criterion: "Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created."
      - id: scope
        tag: habit:requested-scope
        criterion: "Judge only this turn: do the approved requested work. If the kind or subject of the result is open and plausible interpretations require different results, ask what it should cover before choosing. Respect settled choices and approval boundaries. A review question after completed approved work is allowed, not renewed permission. Do not charge an earlier turn's failure to this turn."
      - id: behavior
        tag: skill:act-rightsize-enrich
        criterion: Propose the concrete additions from checked source facts and end before writing an unapproved filling list.
  - prompt: "I do not get your second point about the figures. Explain it another way, without changing the draft."
    purpose: "Explain the prior second point in a different way, using a concrete example rather than repeating it."
    rubric:
      - id: point
        tag: habit:point-first
        criterion: "Judge only the final answer. It uses plain English and leads with the user's main point or required question, without unnecessary preamble or internal process detail. Progress lines are not preamble and are not scored."
      - id: glance
        tag: habit:clear-at-a-glance
        criterion: "Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created."
      - id: scope
        tag: habit:requested-scope
        criterion: "Judge only this turn: do the approved requested work. If the kind or subject of the result is open and plausible interpretations require different results, ask what it should cover before choosing. Respect settled choices and approval boundaries. A review question after completed approved work is allowed, not renewed permission. Do not charge an earlier turn's failure to this turn."
      - id: behavior
        tag: skill:respond-explain
        criterion: "Explain the prior second point in a different way, using a concrete example rather than repeating it."
suite: short
