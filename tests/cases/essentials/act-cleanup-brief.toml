source = "blueprint/design/essentials/act.md: cleanup, test 27; act, routing line for cleanup"
about = "Writing a brief for another agent is a cleanup trigger: the brief asks the helper to clean up after itself and to report what it cleaned, kept and proposed. Rejects a brief that says nothing about the helper's leftovers. Its file checks accept any wording with that meaning, such as 'anything you made or started' for stopping a process; the rubric judges the meaning."
fixture = "recipe-box"
skills = ["act", "act-cleanup"]
covers = ["act:route:act-cleanup", "act-cleanup:step:3"]
category = "normal"
rejects = "Writes a brief with the task alone, so the helper's scratch folder and anything it starts are left behind unasked."
review = ["brief.md gives the helper the task: each recipe in recipes/ scaled to twelve servings, worked in a scratch folder, the results sent back.", "It tells the helper in words to remove what it made and stop what it started before it reports, not only through a report field, and to report what it cleaned, what it kept and why, and what it proposes.", "Nothing other than brief.md changes."]

[[turns]]
prompt = "Write brief.md: a brief for a helper agent that will scale every recipe in recipes/ to twelve servings, working in a scratch folder, and send the scaled recipes back."

[checks]
reads = ["act-cleanup"]
changed = ["brief.md"]

[checks.file_contains]
"brief.md" = ['clean|remov|delet', 'kept|keep', '\bstop|\bkill|shut\S* down|terminat|\bend (it|them|any|every|each|all|the)\b|(made|make|created|create)[^.\n]{0,40}\bstart']
