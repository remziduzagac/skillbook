source = "blueprint/design/essentials/act.md: act, test 23; understand.md: clarify, test 6"
about = "Questions only the hall's caretaker can answer become a questionnaire, kept where the project's instruction file says, at the top of outgoing/questions.md, rather than only in the chat as the skill's default. Rejects asking the user, inventing the details, or leaving the questions only in the answer."
fixture = "garden-club"
skills = ["act", "understand-clarify", "understand-clarify-questionnaire"]
category = "edge"
covers = ["act:rule:10", "understand-clarify:not-for:understand-clarify-shallow"]
rejects = "Puts a round of questions to the user, who said they cannot answer, or invents access details, or returns the questionnaire only in the chat."
review = ["The questions for the caretaker are added at the top of outgoing/questions.md, self-contained for someone who has not seen this folder, and the older entry stays.", "No access or toilet detail is invented in the draft; the part that depends on the answers waits, and the answer says so. The request holds no other work, so no question about going ahead is needed.", "Nothing is sent."]

[[turns]]
prompt = "The fair notice should say whether the hall has step-free access and an accessible toilet. I have no idea; only the hall's caretaker knows."

[checks]
reads = ["understand-clarify-questionnaire"]
reads_not = ["understand-clarify-shallow"]
unchanged = ["sent.log"]

[checks.file_contains]
"outgoing/questions.md" = ['(?i)toilet', '(?i)step', '(?is)toilet.*allotments officer', 'water butt']
