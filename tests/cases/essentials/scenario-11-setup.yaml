about: Propose repository instructions and check skill installation.
design: blueprint/design/testing.md#scenario-layer
goal: Propose repository instructions and check skill installation.
fixture: scenarios/setup
agents:
- codex
user:
  description: You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access.
  facts:
    scope: README.md is authoritative. Propose AGENTS.md; existing personal settings must not change. No settings changes approved.
  mode: fixed
skills:
- coordinate-instruct
- coordinate-setup
category: normal
rejects: Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity.
turns:
- prompt: Read README.md and propose an AGENTS.md for agents working here. Show the proposed text before writing.
  purpose: Propose clear repository-specific instructions based on evidence and stop before writing the instruction file.
  rubric:
  - id: point
    tag: habit:point-first
    criterion: Judge only the final answer. Lead with the user's main point or required question, without unnecessary preamble. Progress is not scored.
  - id: point-english
    tag: habit:plain-english
    criterion: Judge only the final answer. Use plain English. Progress is not scored.
  - id: point-process
    tag: habit:no-internal-process
    criterion: Judge only the final answer. Omit unnecessary internal process detail and internal skill narration. Progress is not scored.
  - id: glance
    tag: habit:clear-at-a-glance
    criterion: Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created. A collective label such as both pages does not name its members; names later in a process report do not complete the result list.
  - id: scope
    tag: habit:requested-scope
    criterion: Judge only this turn. Do the requested work; a review question after completed approved work is allowed. Do not inherit earlier failures.
  - id: scope-intent
    tag: habit:requested-scope
    criterion: If the kind or subject of the requested result is open and plausible interpretations need different results, ask which result the user wants before choosing. Judge only this turn.
  - id: scope-choices
    tag: habit:requested-scope
    criterion: Respect settled user choices in this turn. Judge no earlier failure as a current failure.
  - id: scope-approval
    tag: habit:requested-scope
    criterion: Keep this turn within the actual approval boundary. A review question after completed approved work is allowed.
  - id: behavior
    tag: skill:coordinate-instruct
    criterion: Propose repository-specific instructions grounded in evidence.
  - id: behavior-approval
    tag: skill:coordinate-instruct
    criterion: End before writing the instruction file.
- prompt: Use the proposed content; I approve writing AGENTS.md in this project only. Keep the existing project safety boundary.
