    purpose: "Show an actionable ordered plan with dependencies, then end the turn without setup changes."
    rubric:
      - id: point
        tag: habit:point-first
        criterion: The visible answer uses plain English and leads with the main point or required question. No unnecessary preamble.
      - id: scope
