about: Design a neighbourhood lending scheme.
design: blueprint/design/testing.md#scenario-layer
goal: Design a neighbourhood lending scheme.
fixture: scenarios/lending
agents:
- codex
user:
  description: You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access.
  facts:
    choices: Thirty households, garden tools only, paper signup at the hall, no deposits, volunteers staff Saturday mornings. Design only; no launch approved.
  mode: fixed
skills:
- devise-design
- devise-design-review
- devise-plan
- respond-ask
- understand-clarify-shallow
category: normal
rejects: Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity.
turns:
- prompt: Help us lend things around the neighbourhood.
  purpose: Ask about user-owned choices needed for a design; leave the questions for the user and do not decide their choices. A recommended answer beside a question is allowed while the choice stays with the user; do not treat it as the user's answer or invent user facts.
  rubric:
  - id: point
    tag: habit:point-first
    criterion: Judge only the final answer. Lead with the user's main point or required question, without unnecessary preamble. Progress is not scored.
  - id: point-english
    tag: habit:plain-english
    criterion: Judge only the final answer. Use plain English. Progress is not scored.
  - id: point-process
    tag: habit:no-internal-process
    criterion: Judge only the final answer. Omit unnecessary internal process detail and internal skill narration. Progress is not scored.
  - id: glance
    tag: habit:clear-at-a-glance
    criterion: Judge only the final answer. Its result, finding or required question is clear at a glance. Each thing created, changed or found is named together in one place, not scattered across sentences or left for the reader to infer. Parallel results need equally explicit names; do not name some outputs and only describe the contents of another. No created-item list is needed when nothing was created.
  - id: scope
    tag: habit:requested-scope
    criterion: Judge only this turn. Do the requested work; a review question after completed approved work is allowed. Do not inherit earlier failures.
  - id: scope-intent
    tag: habit:requested-scope
    criterion: If the kind or subject of the requested result is open and plausible interpretations need different results, ask which result the user wants before choosing. Judge only this turn.
  - id: scope-choices
    tag: habit:requested-scope
    criterion: Respect settled user choices in this turn. Judge no earlier failure as a current failure.
  - id: scope-approval
    tag: habit:requested-scope
    criterion: Keep this turn within the actual approval boundary. A review question after completed approved work is allowed.
  - id: behavior
    tag: skill:understand-clarify-shallow
    criterion: Ask about user-owned choices needed for the design.
