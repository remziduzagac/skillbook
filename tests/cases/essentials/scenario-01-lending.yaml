    purpose: Ask about user-owned choices needed for a design; end with the questions and do not answer them yourself.
    rubric:
      - id: point
        tag: habit:point-first
        criterion: The visible answer uses plain English and leads with the main point or required question. No unnecessary preamble.
      - id: scope
        tag: habit:requested-scope
        criterion: "Do exactly what this user turn asks, respecting the prior settled choices and approval boundaries."
      - id: behavior
        tag: skill:understand-clarify-shallow
        criterion: Ask about user-owned choices needed for a design; end with the questions and do not answer them yourself.
      - id: extra-1
        tag: skill:respond-ask
        criterion: Ask only questions the user can answer; never supply their answers.
  - prompt: "We have thirty households, garden tools only, paper signup at the hall, no deposits, volunteers on Saturday mornings. Those are my choices. Design the scheme; do not launch it."
    purpose: "Give a coherent design with reasons for material choices, using the supplied constraints."
    rubric:
      - id: point
        tag: habit:point-first
        criterion: The visible answer uses plain English and leads with the main point or required question. No unnecessary preamble.
      - id: scope
        tag: habit:requested-scope
        criterion: "Do exactly what this user turn asks, respecting the prior settled choices and approval boundaries."
      - id: behavior
        tag: skill:devise-design
        criterion: "Give a coherent design with reasons for material choices, using the supplied constraints."
