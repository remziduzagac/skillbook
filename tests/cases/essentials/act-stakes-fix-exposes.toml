source = "blueprint/design/essentials/act.md: stakes, test 21"
about = "Asked how risky a one-line fix to a recipe's servings line is, the fix itself is judged: one line, inside the project, easy to undo. The upside-down scaling formula and the front matter the plan rules out are there either way: named apart as findings. What the fix does to the formula bug counts: today the scaler fails on this recipe, and after the fix it prints wrong amounts with no error, which hides a failure. So low, or medium for that reason, both pass. Rejects rating the fix by the formula's harm alone."
fixture = "recipe-box"
skills = ["act-stakes"]
covers = ["act-stakes:rule:1", "act-stakes:step:1", "act-stakes:step:6"]
category = "edge"
rejects = "Rates the fix high, or medium only because scaled lentil soup would come out wrong, without saying that the fix turns a failure into silent wrong output; counts the front matter in the fix's reach or cost; or makes the change."
review = ["The answer judges the fix itself: one line in recipes/lentil-soup.md, easy to undo, inside the project. The level is low, or medium because the fix turns the scaler's failure on this recipe into silent wrong output, with a one-line reason.", "Problems there whether or not the fix is made, such as the formula in scale.py or the front matter, are named apart as findings, one line each.", "No file is changed."]

[[turns]]
prompt = "How risky would it be to rewrite the lentil soup's servings line in the Serves: form the plan asks for? Only tell me for now."

[checks]
no_changes = true
answer_contains = ['(?i)\b(low|medium)\b']
answer_not_contains = ['(?i)\b(level|risk)\b[^\n]{0,20}\bhigh\b']
