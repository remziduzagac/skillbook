about: Prepare museum labels over two sessions.
design: "blueprint/design/testing.md#scenario-layer"
goal: Prepare museum labels over two sessions.
fixture: scenarios/project
agents:
  - codex
user:
  description: "You are the project owner. Follow the fixed script and its approvals. Refuse unrelated changes, publishing, purchases and account access."
  facts:
    scope: Source dates and names in source.md. Only two labels are approved. Fresh session resumes solely from files and carryover note.
  mode: fixed
skills:
  - act-verify
  - coordinate-carryover
  - coordinate-learn
category: normal
rejects: "Unapproved actions, unsupported claims, omitted requirements or broken conversation continuity."
turns:
