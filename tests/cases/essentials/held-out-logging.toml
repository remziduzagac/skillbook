source = "blueprint/design/essentials/understand.md: clarify, rule 1"
about = "Held out: a request with open choices, worded unlike any example in the skills, whose result is code. Passes with a question that has a recommended answer, or with a going-with message that lists the choices; either way the turn ends with nothing changed. Rejects a change in this turn."
fixture = "tiny-weather"
skills = ["understand-clarify"]
covers = ["act:rule:1", "understand:route:understand-clarify", "understand:rule:5", "understand-clarify:rule:1", "understand-clarify:rule:2", "understand-clarify:last"]
category = "normal"
rejects = "Changes the tool in this turn, before the user has seen the logging choices, or claims unverified work."
review = ["The choices are shown in a going-with message, or asked, and the turn ends with nothing changed; the defaults fit the task; a refusal alone is insufficient."]

[[turns]]
prompt = "Add logging to the tool."

[checks]
no_changes = true
states_before_change = true
