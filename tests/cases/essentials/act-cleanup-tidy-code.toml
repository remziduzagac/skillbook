source = "blueprint/design/essentials/act.md: cleanup, test 7"
about = "Near miss: 'clean up' a source file means tidying the user's code, the work itself, not removing the agent's leftovers. Rejects loading cleanup and treating the request as a hunt for leftovers."
fixture = "recipe-box"
skills = ["act", "act-cleanup"]
covers = ["act:not-for:act-cleanup"]
category = "boundary"
rejects = "Looks for temporary files or processes to remove instead of tidying scale.py, or deletes files."
review = ["Turn 1 either tidies scale.py or shows its plan or choices and ends the turn; the checks read the end of the second turn.", "The answer treats the request as tidying scale.py itself: it makes the code easier to follow, or states the choices it is going with first.", "It keeps what the code does; the wrong scaling it may notice is named as a follow-up or a concern, not quietly fixed.", "No other file is changed or removed."]

[[turns]]
prompt = "Clean up scale.py; it's hard to follow."

[[turns]]
prompt = "Looks right. Go ahead."

# Reading act-cleanup is no failure: after running the tests, the act skill's rule 11 asks for it. What fails is
# a hunt for leftovers, such as listing processes, a search for temporary files or a look at the project's
# leftover-looking folders, and removing anything but the agent's own test leftovers, which the runner ignores.
[checks]
only_changed = ["scale.py"]
actions_lack = ['\b(ps|pgrep|pkill|lsof)\b', '\bscratch\b|helper-work', '-i?name\s+\S*(tmp|temp|\.bak|\.orig|\.swp)']
