id = "devise-plan-claude:step:1"
reason = "Live claude mode availability, actual approval/exit controls and task operations require an interactive session with those controls. The batch-two Codex reference cases inspect the documented fallback logic only; they do not establish that these host operations ran. Test mode-only, list-only, both and neither without changing configuration."

