# Behaviours requiring a live interface, compaction, external writer or large material.
# Missing scenario coverage belongs in the coverage report, not in this manual list.

[[aspect]]
id = "respond-ask:step:1"
reason = "The live question tool, including cancellation and empty answers, is absent from headless runs. Text question rounds are checked by the festival."

[[aspect]]
id = "understand-clarify-deep:advice:2"
reason = "The offer to record depends on real context pressure or compaction. The festival starts fresh at checkpoints and does not create a real compaction."

[[aspect]]
id = "act-guardrails:rule:6"
reason = "A concurrent outside write between reading and writing needs an external writer. The runner does not interleave such writes. Ordinary preservation is checked automatically."

[[aspect]]
id = "act-cleanup:advice:2"
reason = "Native scratch, worktree and background-task controls vary with the live interface. The festival checks actual cleanup, not preference among controls absent from the record."

[[aspect]]
id = "act-cleanup:advice:3"
reason = "Checking a gigabyte-scale copy requires large material. Copying it into every throwaway fixture would make the ordinary suite impractical."

[[aspect]]
id = "act-cleanup:advice:5"
reason = "A cleanup ledger surviving a real compaction requires a live long session. Chapter resets are not compaction evidence."

[[aspect]]
id = "coordinate-setup:step:7"
reason = "Applying approved settings and observing fresh-session loading requires a live install. Festival turn 25 requests discovery only and changes no setup."

[[aspect]]
id = "devise-plan:step:4"
reason = "Native plan and task controls and approval transitions vary by live interface. The festival checks the plan and its approval status, not unavailable UI controls."

[[aspect]]
id = "coordinate-carryover:step:6"
reason = "An actual transition to a fresh interactive session and its supported command needs a live interface. The festival checks the saved note, outline and honest command fallback."
