[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jotdown"
version = "0.4.0"
description = "A small task list for the command line and a page in your browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jd = "jotdown.cli:main"

[tool.setuptools]
packages = ["jotdown"]
